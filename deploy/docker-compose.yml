# Local Postgres for a self-hosted Inkling. Bind it to localhost only.
# The password comes from the environment (`.env.local` when started with
# `npm run db:up`): POSTGRES_PASSWORD, and the same value inside DATABASE_URL.
#
# Postgres 18 stores data in a versioned directory under /var/lib/postgresql,
# so the named volume is mounted there rather than on .../data.

name: gloss

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: gloss
      POSTGRES_USER: gloss
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.local}
    volumes:
      - gloss-pg:/var/lib/postgresql

volumes:
  gloss-pg:
    name: gloss-pg
