name: ci

on:
  pull_request:
  push:
    branches: [main, selfhost]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # tsc plus type-aware oxlint (no-floating-promises, no-misused-promises)
      - run: npm run lint
      - run: npm test
